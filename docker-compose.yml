services:
  trip-cost-splitter:
    build:
      context: .
      dockerfile: Dockerfile
    image: trip-cost-splitter:latest
    container_name: trip-cost-splitter
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      # Optional. Without it the app uses keyless OSRM/OpenStreetMap.
      MAPY_API_KEY: ${MAPY_API_KEY:-}
    ports:
      # Loopback only: nginx and the Cloudflare Tunnel can reach it, the LAN cannot.
      - '127.0.0.1:3087:3000'
    healthcheck:
      # Checks that the server answers, not that the page contains a given
      # string — the previous version grepped for copy that no longer exists,
      # which left the container permanently unhealthy.
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
